<style>
:root{
    --void:#0a0910;
    --panel:#141020;
    --panel-2:#1b1629;
    --fog:#eae6f5;
    --mist:#a9a4c4;
    --mist-dim:#6b6790;
    --glow:#8398f2;
    --glow-2:#a986e8;
    --glow-dim:#4c4f9e;
    --line: rgba(233,230,245,0.14);
    --line-soft: rgba(233,230,245,0.08);
    /* legacy aliases kept for compatibility with earlier rules */
    --ink:#0a0910;
    --steel:#a9a4c4;
    --steel-light:#6b6790;
    --cloud:#eae6f5;
    --paper:#0a0910;
    --blue:#8398f2;
    --blue-dim:#a483dd;
    --line-dark: rgba(233,230,245,0.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--fog);
    background:var(--void);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2{font-family:'Cinzel',serif;letter-spacing:0.015em;font-weight:600;}
  h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  /* ---------- NAV ---------- */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 32px;
    color:var(--cloud);
    mix-blend-mode:normal;
  }
  .nav-mark{display:flex;align-items:center;gap:12px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;letter-spacing:0.02em;}
  .nav-mark span{color:var(--blue);}
  .nav-mark img{height:30px;width:30px;border-radius:6px;display:block;}
  .nav-mark img.brand-lockup{
    height:46px;width:auto;border-radius:9px;display:block;
    box-shadow:0 0 24px rgba(131,152,242,0.35);
  }
  .nav-links{display:flex;gap:28px;font-size:14px;font-weight:500;}
  .nav-links a{opacity:0.85;transition:opacity .2s;}
  .nav-links a:hover{opacity:1;}
  .nav-cta{
    font-size:13px;font-weight:600;padding:9px 18px;
    border:1px solid rgba(245,247,248,0.4);border-radius:2px;
    transition:background .2s, color .2s, border-color .2s;
  }
  .nav-cta:hover{background:var(--blue);border-color:var(--blue);color:#0a0910;}
  @media (max-width:720px){ .nav-links{display:none;} }

  /* ---------- TELEMETRY STRIP (signature element) ---------- */
  .telemetry{
    display:flex;flex-wrap:wrap;gap:0;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;letter-spacing:0.02em;
  }
  .telemetry .field{
    display:flex;flex-direction:column;gap:4px;
    padding:0 22px;border-left:1px solid var(--line);
  }
  .telemetry .field:first-child{padding-left:0;border-left:none;}
  .telemetry .k{opacity:0.55;font-size:10px;text-transform:uppercase;letter-spacing:0.12em;}
  .telemetry .v{font-size:13px;color:var(--blue);}
  .telemetry.dark .field{border-left-color:var(--line-dark);}
  .telemetry.dark .k{color:var(--steel-light);opacity:0.9;}
  .telemetry.dark .v{color:var(--blue-dim);}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;min-height:100vh;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:120px 0 0 0;
    background:
      radial-gradient(ellipse 760px 480px at 50% 18%, rgba(131,152,242,0.16), transparent 62%),
      radial-gradient(ellipse 900px 520px at 50% 108%, rgba(169,134,232,0.24), transparent 60%),
      linear-gradient(180deg, #060509 0%, #0c0a15 35%, #161129 70%, #1f1938 100%);
    overflow:hidden;
    color:var(--cloud);
  }
  .hero::before{
    /* horizon grid, evokes aerial mapping / topographic scan lines, now read as ley lines */
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(169,150,232,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(169,150,232,0.06) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, black 45%, black 80%, transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0%, black 45%, black 80%, transparent 100%);
    opacity:0.7;
  }
  .hero::after{
    /* sigil: the brand mark, enlarged and dissolved into ambient glow */
    content:"";
